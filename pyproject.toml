[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-video-query-tool"
version = "0.1.0"
description = "YouTube video query tools (API and RSS scrapers)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "feedparser",
]

[project.optional-dependencies]
dev = ["pytest"]
# av<17: faster-whisper 1.2.1 passes metadata_errors=, which PyAV 17+ rejects
asr = ["yt-dlp", "faster-whisper", "av<17"]
# only needed to convert Hugging Face Whisper fine-tunes for faster-whisper
convert = ["ctranslate2", "transformers[torch]"]

[project.scripts]
yt-video-query-tool-api = "yt_video_query_tool.api:main"
yt-video-query-tool-rss = "yt_video_query_tool.rss:main"
yt-video-query-tool-collect = "yt_video_query_tool.collect:main"
yt-video-query-tool-transcribe = "yt_video_query_tool.transcribe:main"
yt-video-query-tool-asr-eval = "yt_video_query_tool.asr_eval:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
